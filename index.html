<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Life in Weeks — Memento Mori</title>
<style>
  /* ═══════════════════════════════════════════════════
     DESIGN TOKENS (from DESIGN.md)
     ═══════════════════════════════════════════════════ */
  :root{
    /* colors */
    --text-primary:#100f12;
    --text-tertiary:#787685;
    --text-inverse:#8d6fde;
    --border-muted:#ffffff;
    --surface-base:#000000;
    --surface-strong:#fbfaff;

    /* typography */
    --font-family:'Ppmori',Arial,sans-serif;
    --font-size-xs:10.4px;
    --font-size-sm:12px;
    --font-size-md:14px;
    --font-size-lg:16px;
    --font-size-xl:18px;
    --font-size-2xl:20px;
    --font-size-3xl:32px;
    --font-size-4xl:36px;
    --font-weight-base:200;
    --line-height-base:20px;

    /* spacing */
    --space-1:8.4px;
    --space-2:10px;
    --space-3:12px;
    --space-4:12.8px;
    --space-5:14px;
    --space-6:16px;
    --space-7:18px;
    --space-8:20px;

    /* radius */
    --radius-xs:5.6px;
    --radius-sm:16px;
    --radius-md:20px;
    --radius-lg:24px;
    --radius-xl:2560px;

    /* motion */
    --motion-instant:200ms;
    --motion-fast:300ms;
    --motion-normal:400ms;

    /* derived cell tokens */
    --cell-size:10px;
    --cell-gap:2px;
    --cell-past:#e8e4f5;
    --cell-past-border:#d4cee8;
    --cell-current-bg:var(--text-inverse);
    --cell-current-border:#a08ae8;
    --cell-future-bg:transparent;
    --cell-future-border:#e0dcee;
    --cell-before-bg:rgba(0,0,0,.03);
    --cell-before-border:transparent;
    --cell-radius:var(--radius-xs);
  }

  /* ═══════════════════════════════════════════════════
     RESET & BASE
     ═══════════════════════════════════════════════════ */
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--font-family);
    font-size:var(--font-size-md);
    font-weight:var(--font-weight-base);
    line-height:var(--line-height-base);
    background:var(--surface-strong);
    color:var(--text-primary);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  ::-webkit-scrollbar{width:5px;height:5px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#e0dcee;border-radius:var(--radius-xl)}

  /* ═══════════════════════════════════════════════════
     MODAL
     ═══════════════════════════════════════════════════ */
  .modal-overlay{
    position:fixed;inset:0;z-index:1000;
    display:none;
    align-items:center;justify-content:center;
    background:rgba(16,15,18,.85);
    backdrop-filter:blur(8px);
  }
  .modal-overlay.show{display:flex}
  .modal{
    background:var(--surface-strong);
    border-radius:var(--radius-md);
    padding:var(--space-8) var(--space-7);
    max-width:400px;width:90%;text-align:center;
    box-shadow:0 4px 24px rgba(16,15,18,.12);
  }
  .modal h1{
    font-size:var(--font-size-2xl);
    font-weight:700;
    color:var(--text-primary);
    margin-bottom:var(--space-1);
  }
  .modal h1 span{color:var(--text-inverse)}
  .modal .sub{
    font-size:var(--font-size-sm);
    color:var(--text-tertiary);
    margin-bottom:var(--space-7);
    line-height:1.6;
  }
  .modal label{
    display:block;
    font-size:var(--font-size-xs);
    font-weight:500;
    text-transform:uppercase;
    letter-spacing:.5px;
    color:var(--text-tertiary);
    text-align:left;
    margin-bottom:var(--space-1);
    margin-top:var(--space-6);
  }
  .modal label:first-of-type{margin-top:0}
  .modal input{
    width:100%;
    padding:var(--space-3) var(--space-5);
    background:#f4f0ff;
    border:1px solid #e0dcee;
    border-radius:var(--radius-sm);
    color:var(--text-primary);
    font-size:var(--font-size-md);
    font-family:var(--font-family);
    font-weight:var(--font-weight-base);
    outline:none;
    transition:border-color var(--motion-instant),box-shadow var(--motion-instant);
  }
  .modal input:focus{
    border-color:var(--text-inverse);
    box-shadow:0 0 0 3px rgba(141,111,222,.15);
  }
  .modal button{
    margin-top:var(--space-7);
    width:100%;
    padding:var(--space-4) var(--space-8);
    background:var(--text-inverse);
    color:var(--surface-strong);
    border:none;
    border-radius:var(--radius-sm);
    font-size:var(--font-size-md);
    font-weight:600;
    font-family:var(--font-family);
    cursor:pointer;
    transition:opacity var(--motion-instant),transform var(--motion-fast);
  }
  .modal button:hover{opacity:.88;transform:translateY(-1px)}
  .modal button:active{transform:translateY(0)}

  /* ═══════════════════════════════════════════════════
     LAYOUT
     ═══════════════════════════════════════════════════ */
  .container{
    max-width:880px;
    width:100%;
    padding:var(--space-8) var(--space-8) var(--space-7);
  }

  header{
    text-align:center;
    margin-bottom:var(--space-7);
    animation:fadeUp var(--motion-normal) .2s both;
  }
  header .icon{font-size:var(--font-size-2xl);margin-bottom:var(--space-1)}
  header h1{
    font-size:var(--font-size-4xl);
    font-weight:400;
    letter-spacing:-.5px;
  }
  header h1 span{color:var(--text-inverse)}
  header .info{
    font-size:var(--font-size-sm);
    color:var(--text-tertiary);
    margin-top:var(--space-1);
  }

  /* ═══════════════════════════════════════════════════
     COUNTER
     ═══════════════════════════════════════════════════ */
  .counter{
    text-align:center;
    margin-bottom:var(--space-8);
    animation:fadeUp var(--motion-normal) .3s both;
  }
  .counter-num{
    font-size:64px;
    font-weight:700;
    letter-spacing:-3px;
    line-height:1;
    color:var(--text-primary);
  }
  .counter-num span{color:var(--text-inverse)}
  .counter-lbl{
    font-size:var(--font-size-sm);
    color:var(--text-tertiary);
    margin-top:var(--space-1);
    text-transform:uppercase;
    letter-spacing:.5px;
  }
  .counter-bar{
    display:flex;align-items:center;justify-content:center;gap:var(--space-2);
    margin-top:var(--space-5);
  }
  .counter-bar .track{
    width:200px;height:3px;
    background:#e0dcee;
    border-radius:var(--radius-xl);
    overflow:hidden;
  }
  .counter-bar .fill{
    height:100%;width:0;
    background:var(--text-inverse);
    border-radius:var(--radius-xl);
    transition:width 2s cubic-bezier(.22,1,.36,1);
  }
  .counter-bar .pct{
    font-size:var(--font-size-xs);
    color:var(--text-tertiary);
    font-variant-numeric:tabular-nums;
    min-width:36px;
  }

  /* ═══════════════════════════════════════════════════
     GRID
     ═══════════════════════════════════════════════════ */
  .grid-section{
    margin-top:var(--space-1);
    animation:fadeUp var(--motion-normal) .5s both;
  }
  .grid-scroll{
    border-radius:var(--radius-sm);
    background:var(--surface-strong);
    padding:var(--space-5) var(--space-6);
    box-shadow:0 1px 3px rgba(16,15,18,.06);
  }
  .grid-outer{display:flex;gap:var(--space-1)}
  .grid-labels{
    display:flex;flex-direction:column;gap:var(--cell-gap);
    position:sticky;left:0;z-index:2;
    flex-shrink:0;
  }
  .lbl{
    height:var(--cell-size);
    font-size:var(--font-size-xs);
    color:var(--text-tertiary);
    display:flex;align-items:center;justify-content:flex-end;
    padding-right:var(--space-1);
    min-width:36px;
    background:var(--surface-strong);
    font-variant-numeric:tabular-nums;
    flex-shrink:0;
    line-height:1;
  }
  .lbl.five{
    color:var(--text-inverse);
    font-weight:600;
    font-size:var(--font-size-xs);
  }
  .lbl.decade-end{margin-bottom:6px}

  .grid{display:flex;flex-direction:column;gap:var(--cell-gap);flex-shrink:0}
  .row{display:flex;gap:var(--cell-gap);height:var(--cell-size);flex-shrink:0}
  .row.decade-end{margin-bottom:6px}

  .c{
    width:var(--cell-size);height:var(--cell-size);
    border-radius:var(--cell-radius);
    background:var(--cell-future-bg);
    border:1px solid var(--cell-future-border);
    transition:background var(--motion-instant),border-color var(--motion-instant),opacity .5s,transform .5s cubic-bezier(.34,1.56,.64,1);
    flex-shrink:0;
    position:relative;
  }
  .c.before-birth{
    background:var(--cell-before-bg);
    border-color:var(--cell-before-border);
  }
  .c.past{
    background:var(--cell-past);
    border-color:var(--cell-past-border);
    opacity:0;transform:scale(.3);
  }
  .c.past.show{opacity:1;transform:scale(1)}
  .c.current{
    background:var(--cell-current-bg);
    border-color:var(--cell-current-border);
    box-shadow:0 0 6px rgba(141,111,222,.25);
    animation:pulse 3s ease-in-out infinite;
    z-index:1;
  }
  .c.future{
    background:var(--cell-future-bg);
    border-color:var(--cell-future-border);
  }

  /* grouping 4-minggu (~bulanan) */
  .c.week-end{margin-right:7px}
  .c.week-end::after{
    content:'';position:absolute;
    right:-5px;top:1px;bottom:1px;
    width:1px;
    background:var(--cell-future-border);
  }

  /* ═══════════════════════════════════════════════════
     LEGEND
     ═══════════════════════════════════════════════════ */
  .legend{
    display:flex;justify-content:center;gap:var(--space-7);
    margin-top:var(--space-6);
    flex-wrap:wrap;
    font-size:var(--font-size-sm);
    color:var(--text-tertiary);
    animation:fadeUp var(--motion-normal) .6s both;
  }
  .legend-item{display:flex;align-items:center;gap:var(--space-1)}
  .dot{
    width:11px;height:11px;
    border-radius:var(--cell-radius);
    border:1px solid var(--cell-future-border);
  }
  .dot.past{background:var(--cell-past);border-color:var(--cell-past-border)}
  .dot.now{background:var(--cell-current-bg);border-color:var(--cell-current-border);animation:pulse 3s infinite}
  .dot.future{background:transparent;border-color:var(--cell-future-border)}

  /* ═══════════════════════════════════════════════════
     FOOTER
     ═══════════════════════════════════════════════════ */
  footer{
    text-align:center;
    margin-top:var(--space-7);
    animation:fadeUp var(--motion-normal) .7s both;
  }
  footer p{
    font-size:var(--font-size-sm);
    color:var(--text-tertiary);
    max-width:440px;
    margin:0 auto var(--space-5);
    line-height:1.6;
  }
  .settings-btn{
    background:none;
    border:1px solid #e0dcee;
    color:var(--text-tertiary);
    padding:var(--space-1) var(--space-6);
    border-radius:var(--radius-xl);
    font-size:var(--font-size-xs);
    cursor:pointer;
    font-family:var(--font-family);
    transition:all var(--motion-instant);
  }
  .settings-btn:hover{
    border-color:var(--text-inverse);
    color:var(--text-inverse);
  }
  .config-info{
    font-size:var(--font-size-xs);
    color:var(--text-tertiary);
    opacity:.4;
    margin-top:var(--space-1);
  }

  /* ═══════════════════════════════════════════════════
     ANIMATIONS
     ═══════════════════════════════════════════════════ */
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(var(--space-6))}
    to{opacity:1;transform:translateY(0)}
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 4px rgba(141,111,222,.2)}
    50%{box-shadow:0 0 10px rgba(141,111,222,.4),0 0 20px rgba(141,111,222,.1)}
  }

  /* ═══════════════════════════════════════════════════
     RESPONSIVE
     ═══════════════════════════════════════════════════ */
  @media(max-width:700px){
    :root{--cell-size:7px;--cell-gap:1.5px}
    header h1{font-size:var(--font-size-3xl)}
    .counter-num{font-size:44px}
    .modal{padding:var(--space-6) var(--space-6)}
    .lbl{font-size:7px;min-width:26px;padding-right:var(--space-1)}
    .lbl.five{font-size:8px}
  }
  @media(max-width:480px){
    :root{--cell-size:5px;--cell-gap:1px}
    .counter-num{font-size:34px}
    .grid-scroll{padding:var(--space-3) var(--space-4)}
    .container{padding:var(--space-6) var(--space-3) var(--space-7)}
    .lbl{font-size:6px;min-width:18px;padding-right:6px}
    .lbl.five{font-size:7px}
    .c.week-end{margin-right:5px}
    .row.decade-end{margin-bottom:4px}
    .lbl.decade-end{margin-bottom:4px}
  }
</style>
</head>
<body>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h1><span>Life</span> in Weeks</h1>
    <p class="sub">Kapan perjalananmu dimulai, dan sampai kapan kamu ingin melangkah?</p>
    <label>Tanggal Lahir</label>
    <input type="date" id="birthInput">
    <label>Target Usia</label>
    <input type="number" id="ageInput" value="75" min="1" max="120">
    <button id="startBtn">Mulai</button>
    <p class="sub" id="modalHint" style="margin-top:var(--space-1);font-size:var(--font-size-xs);color:var(--text-tertiary);opacity:.6"></p>
  </div>
</div>

<div class="container">
  <header>
    <div class="icon">🕯️</div>
    <h1>Memento <span>Mori</span></h1>
    <p class="info" id="ageInfo">—</p>
  </header>

  <div class="counter">
    <div class="counter-num" id="counterNum">0</div>
    <div class="counter-lbl">minggu tersisa</div>
    <div class="counter-bar">
      <span class="pct" id="pctL">0%</span>
      <div class="track"><div class="fill" id="barFill"></div></div>
      <span class="pct" id="pctR">100%</span>
    </div>
  </div>

  <div class="grid-section">
    <div class="grid-scroll">
      <div class="grid-outer">
        <div class="grid-labels" id="gridLabels"></div>
        <div class="grid" id="grid"></div>
      </div>
    </div>
    <div class="legend">
      <div class="legend-item"><span class="dot past"></span>Terlewati</div>
      <div class="legend-item"><span class="dot now"></span>Sekarang</div>
      <div class="legend-item"><span class="dot future"></span>Tersisa</div>
    </div>
  </div>

  <footer>
    <p>"Hidup bukan tentang berapa banyak minggu yang kau miliki, tapi apa yang kau lakukan dengan minggu yang tersisa."</p>
    <button class="settings-btn" id="settingsBtn">⚙️ Pengaturan</button>
    <p class="config-info" id="configInfo"></p>
  </footer>
</div>

<script>
// ── STATE ──
let BD, TA, totalW, livedW, editMode=false;

// ── DOM ──
const $=s=>document.querySelector(s);
const modal=$('#modal'), bInput=$('#birthInput'), aInput=$('#ageInput'), startBtn=$('#startBtn');
const grid=$('#grid'), labels=$('#gridLabels');
const cNum=$('#counterNum'), bar=$('#barFill'), pL=$('#pctL'), pR=$('#pctR');
const info=$('#ageInfo');
const settingsBtn=$('#settingsBtn');

function fmt(d){
  const M=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  return d.getDate()+' '+M[d.getMonth()]+' '+d.getFullYear();
}
function weekDates(r,c){
  const yr=new Date(BD); yr.setFullYear(BD.getFullYear()+r);
  const s=new Date(yr); s.setDate(s.getDate()+c*7);
  const e=new Date(s); e.setDate(e.getDate()+6);
  return{s,e};
}
function cellStatus(r,c){
  const{s,e}=weekDates(r,c);
  const death=new Date(BD); death.setFullYear(BD.getFullYear()+TA);
  const now=new Date();
  if(e<BD) return 'before-birth';
  if(s>death) return 'after-death';
  if(e<now) return 'past';
  if(s<=now&&now<=e) return 'current';
  return 'future';
}

// ── COUNTER ──
function animCount(target){
  const dur=1800,t0=performance.now();
  (function step(t){
    const p=Math.min((t-t0)/dur,1),e=1-Math.pow(1-p,3);
    cNum.textContent=Math.round(target*e).toLocaleString('id-ID');
    if(p<1) requestAnimationFrame(step);
  })(t0);
}

// ── ANIMATE PAST CELLS ──
function animPast(els){
  if(!els.length) return;
  const dur=Math.min(2200,Math.max(600,els.length*2.5));
  els.forEach((el,i)=>{setTimeout(()=>el.classList.add('show'),(i/els.length)*dur)});
}

// ── BUILD ──
function build(){
  grid.innerHTML=''; labels.innerHTML='';

  const now=new Date(), death=new Date(BD);
  death.setFullYear(BD.getFullYear()+TA);
  const daysTotal=(death-BD)/864e5, daysLived=Math.max(0,(now-BD)/864e5);
  totalW=Math.round(daysTotal/7); livedW=Math.floor(daysLived/7);
  const remain=Math.max(0,totalW-livedW);

  const years=TA;
  const pastCells=[];

  // Labels
  for(let r=0;r<years;r++){
    const lbl=document.createElement('div');
    if(r%5===0&&r>0){lbl.className='lbl five';lbl.textContent=r}
    else{lbl.className='lbl'}
    if(r%10===9&&r<years-1) lbl.classList.add('decade-end');
    labels.appendChild(lbl);
  }

  // Grid rows
  for(let r=0;r<years;r++){
    const row=document.createElement('div');
    row.className='row';
    if(r%10===9&&r<years-1) row.classList.add('decade-end');

    for(let c=0;c<52;c++){
      const st=cellStatus(r,c);
      const el=document.createElement('div');
      el.className='c '+st;
      if(c%4===3&&c<51) el.classList.add('week-end');
      row.appendChild(el);
      if(st==='past') pastCells.push(el);
    }
    grid.appendChild(row);
  }

  // Counter & bar
  animCount(remain);
  const pct=totalW>0?(livedW/totalW)*100:0;
  setTimeout(()=>{bar.style.width=Math.min(pct,100)+'%';pL.textContent=Math.round(pct)+'%';pR.textContent=Math.round(100-pct)+'%'},200);

  const yrs=Math.floor(daysLived/365.25);
  info.textContent='Usia '+yrs+' tahun · Target '+TA+' tahun · Lahir '+fmt(BD);

  // Cascade animation
  animPast(pastCells);
}

// ── INIT ──
function showModal(editing){
  editMode=!!editing;
  const s=JSON.parse(localStorage.getItem('lw')||'null');
  if(s){bInput.value=s.birth;aInput.value=s.age}
  else if(!editing){const def=new Date();def.setFullYear(def.getFullYear()-30);bInput.value=def.toISOString().split('T')[0]}
  startBtn.textContent=editMode?'Simpan':'Mulai';
  document.getElementById('modalHint').textContent=editMode?'Edit data yang sudah tersimpan — klik Simpan untuk memperbarui.':'Isi data kamu untuk memulai.';
  modal.classList.add('show');
}

startBtn.addEventListener('click',()=>{
  const b=bInput.value,a=parseInt(aInput.value);
  if(!b||!a||a<1) return;
  BD=new Date(b+'T00:00:00'); TA=a;
  if(isNaN(BD.getTime())) return;
  localStorage.setItem('lw',JSON.stringify({birth:b,age:a}));
  modal.classList.remove('show'); build();
  const ci=document.getElementById('configInfo');
  if(ci) ci.textContent='Lahir '+b+' · Target '+a+' tahun';
});
settingsBtn.addEventListener('click',()=>{showModal(true)});
aInput.addEventListener('keydown',e=>{if(e.key==='Enter')startBtn.click()});
bInput.addEventListener('keydown',e=>{if(e.key==='Enter')startBtn.click()});

function init(){
  const saved=localStorage.getItem('lw');
  if(saved){
    try{
      const d=JSON.parse(saved); BD=new Date(d.birth); TA=d.age;
      if(!isNaN(BD.getTime())&&TA>0){
        const ci=document.getElementById('configInfo');
        if(ci) ci.textContent='Lahir '+d.birth+' · Target '+TA+' tahun';
        build();return
      }
    }catch(e){}
  }
  showModal(false);
}

init();
</script>
</body>
</html>
