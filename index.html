<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Life in Weeks — Memento Mori</title>
<style>
  /* ═══════════════════════════════════════════════════════
     DESIGN TOKENS (from DESIGN.md)
     ═══════════════════════════════════════════════════════ */
  :root{
    /* ── colors ── */
    --text-primary:#100f12;
    --text-tertiary:#787685;
    --text-inverse:#8d6fde;
    --border-muted:#ffffff;
    --surface-base:#000000;
    --surface-strong:#fbfaff;

    /* ── typography ── */
    --font-family:'Ppmori',Arial,sans-serif;
    --font-size-xs:10.4px;
    --font-size-sm:12px;
    --font-size-md:14px;
    --font-size-lg:16px;
    --font-size-xl:18px;
    --font-size-2xl:20px;
    --font-size-3xl:32px;
    --font-size-4xl:36px;
    --font-weight-base:200;
    --line-height-base:20px;

    /* ── spacing ── */
    --space-1:8.4px;
    --space-2:10px;
    --space-3:12px;
    --space-4:12.8px;
    --space-5:14px;
    --space-6:16px;
    --space-7:18px;
    --space-8:20px;

    /* ── radius ── */
    --radius-xs:5.6px;
    --radius-sm:16px;
    --radius-md:20px;
    --radius-lg:24px;
    --radius-xl:2560px;

    /* ── motion ── */
    --motion-instant:200ms;
    --motion-fast:300ms;
    --motion-normal:400ms;

    /* ── derived tokens ── */
    --cell-size:10px;
    --cell-gap:2px;
    --cell-radius:var(--radius-xs);
    --cell-past:var(--surface-base);
    --cell-past-border:var(--surface-base);
    --cell-current-bg:var(--text-inverse);
    --cell-current-border:#a08ae8;
    --cell-current-dot:#ffffff;
    --cell-future-bg:transparent;
    --cell-future-border:#c8c0db;
    --cell-future-near-bg:rgba(141,111,222,.08);
    --cell-future-near-border:var(--text-inverse);
    --cell-before-bg:transparent;
    --cell-before-border:transparent;
    --decade-gap:8px;
    --week-end-margin:7px;
    --grid-bg:#f6f2ff;
    --focus-ring:0 0 0 3px rgba(141,111,222,.25);
    --font-size-hero:72px;
    --color-bg-input:#f3effa;
    --color-border-input:#e0dcee;
    --color-track-bg:#e0dcee;
    --color-scrollbar:#d4cee8;
    --color-scrollbar-hover:#c0b8e0;
    --color-btn-shadow:rgba(141,111,222,.25);
    --color-shadow-subtle:rgba(16,15,18,.06);
    --modal-bg:rgba(16,15,18,.75);
  }

  /* ═══════════════════════════════════════════════════════
     RESET & BASE
     ═══════════════════════════════════════════════════════ */
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--font-family);
    font-size:var(--font-size-md);
    font-weight:var(--font-weight-base);
    line-height:var(--line-height-base);
    background:var(--surface-strong);
    color:var(--text-primary);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  :focus-visible{
    outline:none;
    box-shadow:var(--focus-ring);
  }

  ::-webkit-scrollbar{width:5px;height:5px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--color-scrollbar);border-radius:var(--radius-xl)}
  ::-webkit-scrollbar-thumb:hover{background:var(--color-scrollbar-hover)}

  /* ═══════════════════════════════════════════════════════
     MODAL
     ═══════════════════════════════════════════════════════ */
  .modal-overlay{
    position:fixed;inset:0;z-index:1000;
    display:flex;
    align-items:center;justify-content:center;
    background:var(--modal-bg);
    backdrop-filter:blur(6px);
    opacity:0;
    pointer-events:none;
    transition:opacity var(--motion-normal);
  }
  .modal-overlay.show{
    opacity:1;
    pointer-events:auto;
  }
  .modal{
    background:var(--surface-strong);
    border-radius:var(--radius-md);
    padding:var(--space-8) var(--space-7) var(--space-8);
    max-width:400px;width:90%;text-align:center;
    box-shadow:0 8px 32px rgba(16,15,18,.1), 0 2px 8px rgba(16,15,18,.06);
    transform:translateY(var(--space-6)) scale(.97);
    transition:transform var(--motion-normal) cubic-bezier(.22,1,.36,1);
  }
  .modal-overlay.show .modal{
    transform:translateY(0) scale(1);
  }
  .modal-icon{
    font-size:var(--font-size-4xl);
    margin-bottom:var(--space-3);
    display:block;
    opacity:.7;
  }
  .modal h1{
    font-size:var(--font-size-3xl);
    font-weight:500;
    letter-spacing:-.5px;
    color:var(--text-primary);
    margin-bottom:var(--space-1);
  }
  .modal h1 span{color:var(--text-inverse)}
  .modal .sub{
    font-size:var(--font-size-sm);
    color:var(--text-tertiary);
    margin-bottom:var(--space-7);
    line-height:1.65;
  }
  .modal .sub-hint{
    font-size:var(--font-size-xs);
    color:var(--text-tertiary);
    margin-top:var(--space-2);
    opacity:.55;
    line-height:1.4;
  }
  .modal label{
    display:block;
    font-size:var(--font-size-xs);
    font-weight:500;
    text-transform:uppercase;
    letter-spacing:.5px;
    color:var(--text-tertiary);
    text-align:left;
    margin-bottom:var(--space-1);
    margin-top:var(--space-6);
  }
  .modal label:first-of-type{margin-top:0}
  .modal input{
    width:100%;
    padding:var(--space-3) var(--space-5);
    background:var(--color-bg-input);
    border:1px solid var(--color-border-input);
    border-radius:var(--radius-sm);
    color:var(--text-primary);
    font-size:var(--font-size-md);
    font-family:var(--font-family);
    font-weight:var(--font-weight-base);
    outline:none;
    transition:border-color var(--motion-instant),box-shadow var(--motion-instant);
    -webkit-appearance:none;
  }
  .modal input:focus{
    border-color:var(--text-inverse);
    box-shadow:var(--focus-ring);
  }
  .modal input::placeholder{
    color:var(--text-tertiary);
    opacity:.4;
  }
  .modal button{
    margin-top:var(--space-7);
    width:100%;
    padding:var(--space-4) var(--space-8);
    background:var(--text-inverse);
    color:var(--surface-strong);
    border:none;
    border-radius:var(--radius-sm);
    font-size:var(--font-size-md);
    font-weight:600;
    font-family:var(--font-family);
    cursor:pointer;
    transition:opacity var(--motion-instant),transform var(--motion-fast),box-shadow var(--motion-instant);
    -webkit-appearance:none;
  }
  .modal button:hover{
    opacity:.9;
    transform:translateY(-1px);
    box-shadow:0 4px 16px var(--color-btn-shadow);
  }
  .modal button:active{transform:translateY(0)}
  .modal button:focus-visible{
    box-shadow:var(--focus-ring), 0 4px 16px var(--color-btn-shadow);
  }

  /* ═══════════════════════════════════════════════════════
     LAYOUT
     ═══════════════════════════════════════════════════════ */
  .page{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ── Hero header ── */
  .hero{
    width:100%;
    background:var(--surface-base);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:var(--space-8) var(--space-8) var(--space-7);
  }
  .hero-inner{
    max-width:880px;
    width:100%;
    text-align:center;
  }
  .hero .icon{font-size:var(--font-size-3xl);margin-bottom:var(--space-1);opacity:.55}
  .hero h1{
    font-size:var(--font-size-4xl);
    font-weight:400;
    letter-spacing:-.5px;
    color:var(--surface-strong);
  }
  .hero h1 span{color:var(--text-inverse)}
  .hero .info{
    font-size:var(--font-size-sm);
    color:var(--text-tertiary);
    margin-top:var(--space-1);
  }

  .container{
    max-width:880px;
    width:100%;
    padding:var(--space-8) var(--space-8) var(--space-7);
  }

  /* ═══════════════════════════════════════════════════════
     COUNTER
     ═══════════════════════════════════════════════════════ */
  .counter{
    text-align:center;
    margin-bottom:var(--space-6);
    animation:fadeUp var(--motion-normal) .2s both;
  }
  .counter-num{
    font-size:var(--font-size-hero);
    font-weight:700;
    letter-spacing:-3px;
    line-height:1;
    color:var(--text-primary);
  }
  .counter-num .accent{color:var(--text-inverse)}
  .counter-lbl{
    font-size:var(--font-size-sm);
    color:var(--text-tertiary);
    margin-top:var(--space-1);
    text-transform:uppercase;
    letter-spacing:3px;
    font-weight:500;
  }
  .counter-bar{
    display:flex;align-items:center;justify-content:center;gap:var(--space-2);
    margin-top:var(--space-5);
  }
  .counter-bar .track{
    width:220px;height:3px;
    background:var(--color-track-bg);
    border-radius:var(--radius-xl);
    overflow:hidden;
  }
  .counter-bar .fill{
    height:100%;width:0;
    background:var(--text-inverse);
    border-radius:var(--radius-xl);
    transition:width 2s cubic-bezier(.22,1,.36,1);
  }
  .counter-bar .pct{
    font-size:var(--font-size-xs);
    color:var(--text-tertiary);
    font-variant-numeric:tabular-nums;
    min-width:36px;
  }

  /* ═══════════════════════════════════════════════════════
     GRID
     ═══════════════════════════════════════════════════════ */
  .grid-section{
    animation:fadeUp var(--motion-normal) .5s both;
    margin-bottom:var(--space-8);
  }
  .grid-scroll{
    border-radius:var(--radius-sm);
    background:var(--grid-bg);
    padding:var(--space-5) var(--space-6);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 1px 3px var(--color-shadow-subtle);
    overflow-x:auto;
  }
  .grid-outer{display:flex;gap:var(--space-1)}
  .grid-labels{
    display:flex;flex-direction:column;gap:var(--cell-gap);
    position:sticky;left:0;z-index:2;
    flex-shrink:0;
  }
  .lbl{
    height:var(--cell-size);
    font-size:var(--font-size-xs);
    color:var(--text-tertiary);
    display:flex;align-items:center;justify-content:flex-end;
    padding-right:var(--space-1);
    min-width:30px;
    background:var(--grid-bg);
    font-variant-numeric:tabular-nums;
    flex-shrink:0;
    line-height:1;
  }
  .lbl.five{
    color:var(--text-inverse);
    font-weight:600;
  }
  .lbl.decade-end{margin-bottom:var(--decade-gap)}

  .grid{
    display:flex;
    flex-direction:column;
    gap:var(--cell-gap);
    flex-shrink:0;
  }
  .row{
    display:flex;
    gap:var(--cell-gap);
    height:var(--cell-size);
    flex-shrink:0;
  }
  .row.decade-end{margin-bottom:var(--decade-gap)}

  .c{
    width:var(--cell-size);
    height:var(--cell-size);
    border-radius:var(--cell-radius);
    background:var(--cell-future-bg);
    border:1px solid var(--cell-future-border);
    transition:background var(--motion-instant),border-color var(--motion-instant),
              opacity .5s,transform .5s cubic-bezier(.34,1.56,.64,1);
    flex-shrink:0;
    position:relative;
    cursor:default;
  }
  .c.before-birth{
    background:var(--cell-before-bg);
    border-color:var(--cell-before-border);
  }
  .c.past{
    background:var(--cell-past);
    border-color:var(--cell-past-border);
    opacity:0;transform:scale(.3);
  }
  .c.past.show{
    opacity:1;
    transform:scale(1);
  }

  /* ── CURRENT: you are here, this is the moment ── */
  .c.current{
    background:var(--cell-current-bg);
    border-color:var(--cell-current-border);
    box-shadow:0 0 8px rgba(141,111,222,.45);
    animation:pulse-current 1.5s ease-in-out infinite;
    z-index:2;
  }
  .c.current::after{
    content:'';
    position:absolute;
    inset:50%;
    width:3px;height:3px;
    margin:-1.5px 0 0 -1.5px;
    border-radius:var(--radius-xl);
    background:var(--cell-current-dot);
    box-shadow:0 0 4px rgba(255,255,255,.6);
  }

  /* ── FUTURE: precious near, void far ── */
  .c.future{
    background:var(--cell-future-bg);
    border-color:var(--cell-future-border);
    opacity:calc(1 - var(--future-fade, 0));
    transition:background var(--motion-instant),border-color var(--motion-instant),
              opacity .5s,transform .5s cubic-bezier(.34,1.56,.64,1);
  }
  .c.future-near{
    background:var(--cell-future-near-bg);
    border-color:var(--cell-future-near-border);
    opacity:calc(1 - var(--future-fade, 0) * .5);
  }

  /* ── 4-week grouping (~monthly) ── */
  .c.week-end{margin-right:var(--week-end-margin)}
  .c.week-end::after{
    content:'';position:absolute;
    right:-5px;top:2px;bottom:2px;
    width:1px;
    background:var(--color-border-input);
  }



  /* ═══════════════════════════════════════════════════════
     MINI STATS — visual sisa
     ═══════════════════════════════════════════════════════ */
  .mini-stats{
    display:flex;
    justify-content:center;
    gap:var(--space-8);
    margin-top:var(--space-6);
    animation:fadeUp var(--motion-normal) .35s both;
  }
  .mini-stat{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:var(--space-1);
  }
  .mini-bar-row{
    display:flex;
    align-items:center;
    gap:var(--space-2);
  }
  .mini-track{
    width:60px;height:4px;
    border-radius:var(--radius-xl);
    background:var(--color-track-bg);
    overflow:hidden;
    flex-shrink:0;
  }
  .mini-fill{
    height:100%;width:0;
    background:var(--text-inverse);
    border-radius:var(--radius-xl);
    transition:width 1.5s cubic-bezier(.22,1,.36,1);
  }
  .mini-num{
    font-size:var(--font-size-lg);
    font-weight:600;
    color:var(--text-primary);
    font-variant-numeric:tabular-nums;
    min-width:28px;
    line-height:1;
  }
  .mini-label{
    font-size:var(--font-size-xs);
    color:var(--text-tertiary);
    letter-spacing:.5px;
    padding-left:calc(60px + var(--space-2)); /* align with number */
  }
  @media(max-width:480px){
    .mini-stats{gap:var(--space-6)}
    .mini-track{width:44px}
    .mini-num{font-size:var(--font-size-md);min-width:22px}
    .mini-label{padding-left:calc(44px + var(--space-2))}
  }

  /* ═══════════════════════════════════════════════════════
     LEGEND
     ═══════════════════════════════════════════════════════ */
  .legend{
    display:flex;justify-content:center;gap:var(--space-7);
    margin-bottom:var(--space-6);
    flex-wrap:wrap;
    font-size:var(--font-size-sm);
    color:var(--text-tertiary);
    animation:fadeUp var(--motion-normal) .3s both;
  }
  .legend-item{display:flex;align-items:center;gap:var(--space-1)}
  .dot{
    width:11px;height:11px;
    border-radius:var(--cell-radius);
    border:1px solid var(--cell-future-border);
    flex-shrink:0;
  }
  .dot.past{background:var(--cell-past);border-color:var(--cell-past-border)}
  .dot.now{
    background:var(--cell-current-bg);
    border-color:var(--cell-current-border);
    animation:pulse-legend 3s infinite;
  }
  .dot.future{background:transparent;border-color:var(--cell-future-border)}

  /* ═══════════════════════════════════════════════════════
     FOOTER
     ═══════════════════════════════════════════════════════ */
  .footer{
    text-align:center;
    margin-bottom:var(--space-7);
    animation:fadeUp var(--motion-normal) .4s both;
  }
  .footer-quote{
    font-size:var(--font-size-sm);
    color:var(--text-tertiary);
    max-width:440px;
    margin:0 auto var(--space-6);
    line-height:1.65;
    font-style:italic;
  }
  .settings-btn{
    background:none;
    border:1px solid var(--color-border-input);
    color:var(--text-tertiary);
    padding:var(--space-1) var(--space-7);
    border-radius:var(--radius-xl);
    font-size:var(--font-size-xs);
    cursor:pointer;
    font-family:var(--font-family);
    transition:all var(--motion-instant);
    -webkit-appearance:none;
  }
  .settings-btn:hover{
    border-color:var(--text-inverse);
    color:var(--text-inverse);
  }
  .settings-btn:focus-visible{
    box-shadow:var(--focus-ring);
  }
  .config-info{
    font-size:var(--font-size-xs);
    color:var(--text-tertiary);
    opacity:.35;
    margin-top:var(--space-2);
  }

  /* ═══════════════════════════════════════════════════════
     ANIMATIONS
     ═══════════════════════════════════════════════════════ */
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(var(--space-6))}
    to{opacity:1;transform:translateY(0)}
  }
  @keyframes pulse-current{
    0%,100%{box-shadow:0 0 4px rgba(141,111,222,.35)}
    50%{box-shadow:0 0 12px rgba(141,111,222,.6),0 0 24px rgba(141,111,222,.2)}
  }
  @keyframes pulse-legend{
    0%,100%{box-shadow:0 0 4px rgba(141,111,222,.2)}
    50%{box-shadow:0 0 10px rgba(141,111,222,.4),0 0 20px rgba(141,111,222,.1)}
  }

  /* ═══════════════════════════════════════════════════════
     RESPONSIVE
     ═══════════════════════════════════════════════════════ */
  @media(max-width:700px){
    :root{
      --cell-size:7px;
      --cell-gap:1.5px;
      --decade-gap:6px;
    }
    .hero{padding:var(--space-7) var(--space-6) var(--space-6)}
    .hero h1{font-size:var(--font-size-3xl)}
    .counter-num{font-size:48px}
    .container{padding:var(--space-6) var(--space-6)}
    .modal{padding:var(--space-7) var(--space-6)}
    .lbl{font-size:7px;min-width:22px}
  }
  @media(max-width:480px){
    :root{
      --cell-size:5px;
      --cell-gap:1px;
      --decade-gap:5px;
    }
    .hero{padding:var(--space-6) var(--space-4) var(--space-5)}
    .hero h1{font-size:var(--font-size-2xl)}
    .counter-num{font-size:36px}
    .grid-scroll{padding:var(--space-3) var(--space-4)}
    .container{padding:var(--space-5) var(--space-3) var(--space-6)}
    .lbl{font-size:6px;min-width:16px;padding-right:4px}
    .lbl.five{font-size:7px}
    .c.week-end{margin-right:5px}
    .row.decade-end{margin-bottom:var(--decade-gap)}
    .lbl.decade-end{margin-bottom:var(--decade-gap)}
    .modal{padding:var(--space-6) var(--space-5);max-width:340px}
    .counter-bar .track{width:140px}
  }
</style>
</head>
<body>

<!-- ── MODAL ── -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <span class="modal-icon">🕯️</span>
    <h1><span>Life</span> in Weeks</h1>
    <p class="sub">Kapan perjalananmu dimulai,<br>dan sampai kapan kamu ingin melangkah?</p>
    <label>Tanggal Lahir</label>
    <input type="date" id="birthInput">
    <label>Target Usia (tahun)</label>
    <input type="number" id="ageInput" value="75" min="1" max="120" placeholder="75">
    <button id="startBtn">Mulai</button>
    <p class="sub-hint" id="modalHint">Isi data kamu untuk memulai.</p>
  </div>
</div>

<!-- ── PAGE ── -->
<div class="page">

  <!-- Hero -->
  <div class="hero">
    <div class="hero-inner">
      <div class="icon">🕯️</div>
      <h1>Memento <span>Mori</span></h1>
      <p class="info" id="ageInfo">—</p>
    </div>
  </div>

  <div class="container">

    <div class="counter">
      <div class="counter-num"><span class="accent" id="counterNum">0</span></div>
      <div class="counter-lbl">akhir pekan</div>
      <div class="counter-bar">
        <span class="pct" id="pctL">0%</span>
        <div class="track"><div class="fill" id="barFill"></div></div>
        <span class="pct" id="pctR">100%</span>
      </div>

      <div class="mini-stats" id="miniStats">
        <div class="mini-stat">
          <div class="mini-bar-row">
            <div class="mini-track"><div class="mini-fill" id="yearFill"></div></div>
            <span class="mini-num" id="yearNum">0</span>
          </div>
          <span class="mini-label" id="yearLabel">—</span>
        </div>
        <div class="mini-stat">
          <div class="mini-bar-row">
            <div class="mini-track"><div class="mini-fill" id="milestoneFill"></div></div>
            <span class="mini-num" id="milestoneNum">0</span>
          </div>
          <span class="mini-label" id="milestoneLabel">—</span>
        </div>
      </div>
    </div>

    <!-- Legend -->
    <div class="legend">
      <div class="legend-item"><span class="dot past"></span>Terlewati</div>
      <div class="legend-item"><span class="dot now"></span>Sekarang</div>
      <div class="legend-item"><span class="dot future"></span>Tersisa</div>
    </div>

    <!-- Footer -->
    <div class="footer">

      <button class="settings-btn" id="settingsBtn">⚙️ Pengaturan</button>
      <p class="config-info" id="configInfo"></p>
    </div>

    <!-- Grid (paling bawah) -->
    <div class="grid-section">
      <div class="grid-scroll">
        <div class="grid-outer">
          <div class="grid-labels" id="gridLabels"></div>
          <div class="grid" id="grid"></div>
        </div>
      </div>

  </div>
</div>

<script>
// ── STATE ──
let BD, TA, totalW, livedW, editMode=false;

// ── DOM ──
const $=s=>document.querySelector(s);
const modal=$('#modal'), bInput=$('#birthInput'), aInput=$('#ageInput'), startBtn=$('#startBtn');
const grid=$('#grid'), labels=$('#gridLabels');
const cNum=$('#counterNum'), bar=$('#barFill'), pL=$('#pctL'), pR=$('#pctR');
const info=$('#ageInfo');
const yearFill=$('#yearFill'), yearNum=$('#yearNum'), yearLabel=$('#yearLabel');
const mileFill=$('#milestoneFill'), mileNum=$('#milestoneNum'), mileLabel=$('#milestoneLabel');
const settingsBtn=$('#settingsBtn');

function fmt(d){
  const M=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  return d.getDate()+' '+M[d.getMonth()]+' '+d.getFullYear();
}
function weekDates(r,c){
  const yr=new Date(BD); yr.setFullYear(BD.getFullYear()+r);
  const s=new Date(yr); s.setDate(s.getDate()+c*7);
  const e=new Date(s); e.setDate(e.getDate()+6);
  return{s,e};
}
function cellStatus(r,c){
  const{s,e}=weekDates(r,c);
  const death=new Date(BD); death.setFullYear(BD.getFullYear()+TA);
  const now=new Date();
  if(e<BD) return 'before-birth';
  if(s>death) return 'after-death';
  if(e<now) return 'past';
  if(s<=now&&now<=e) return 'current';
  // determine near vs far future
  const weeksAhead=(s-now)/6048e5; // ms → weeks
  if(weeksAhead<=78) return 'future-near'; // ~1.5 tahun
  return 'future';
}

// ── COUNTER ──
function animCount(target){
  const dur=1800,t0=performance.now();
  (function step(t){
    const p=Math.min((t-t0)/dur,1),e=1-Math.pow(1-p,3);
    cNum.textContent=Math.round(target*e).toLocaleString('id-ID');
    if(p<1) requestAnimationFrame(step);
  })(t0);
}

// ── ANIMATE PAST CELLS ──
function animPast(els){
  if(!els.length) return;
  const dur=Math.min(2200,Math.max(600,els.length*2.5));
  els.forEach((el,i)=>{setTimeout(()=>el.classList.add('show'),(i/els.length)*dur)});
}

// ── BUILD ──
function build(){
  grid.innerHTML=''; labels.innerHTML='';

  const now=new Date(), death=new Date(BD);
  death.setFullYear(BD.getFullYear()+TA);
  const daysTotal=(death-BD)/864e5, daysLived=Math.max(0,(now-BD)/864e5);
  totalW=Math.round(daysTotal/7); livedW=Math.floor(daysLived/7);
  const remain=Math.max(0,totalW-livedW);

  const years=TA;
  const pastCells=[];

  // ── Labels ──
  for(let r=0;r<years;r++){
    const lbl=document.createElement('div');
    lbl.className=r%5===0&&r>0?'lbl five':'lbl';
    if(r%5===0&&r>0) lbl.textContent=r;
    if(r%10===9&&r<years-1) lbl.classList.add('decade-end');
    labels.appendChild(lbl);
  }

  // ── Grid rows ──
  for(let r=0;r<years;r++){
    const row=document.createElement('div');
    row.className='row';
    if(r%10===9&&r<years-1) row.classList.add('decade-end');

    for(let c=0;c<52;c++){
      const st=cellStatus(r,c);
      const el=document.createElement('div');
      el.className='c '+st;
      if(c%4===3&&c<51) el.classList.add('week-end');

      // future gradient: fade into the void
      if(st==='future'||st==='future-near'){
        const globalW=r*52+c;
        const weeksAhead=Math.max(0,globalW-livedW);
        const totalFuture=Math.max(1,totalW-livedW);
        const fade=Math.min(1,Math.pow(weeksAhead/totalFuture,.7));
        el.style.setProperty('--future-fade',fade);
      }

      row.appendChild(el);
      if(st==='past') pastCells.push(el);
    }
    grid.appendChild(row);
  }

  // ── Counter & bar ──
  animCount(remain);
  const pct=totalW>0?(livedW/totalW)*100:0;
  setTimeout(()=>{
    bar.style.width=Math.min(pct,100)+'%';
    pL.textContent=Math.round(pct)+'%';
    pR.textContent=Math.round(100-pct)+'%';
  },200);

  const yrs=Math.floor(daysLived/365.25);
  info.textContent='Usia '+yrs+' tahun · Target '+TA+' tahun · Lahir '+fmt(BD);

  // ── Mini stats ──
  const now2=new Date();
  // Year remaining
  const yearEnd=new Date(now2.getFullYear(),11,31);
  const yearElapsed=(now2-new Date(now2.getFullYear(),0,1))/864e5;
  const yearTotal=(yearEnd-new Date(now2.getFullYear(),0,1))/864e5+1;
  const yearPct=Math.min(100,(yearElapsed/yearTotal)*100);
  const yearWeeksLeft=Math.max(0,Math.floor((yearEnd-now2)/6048e5));
  yearFill.style.width=yearPct+'%';
  yearNum.textContent=yearWeeksLeft;
  yearLabel.textContent=now2.getFullYear();

  // Milestone: next 5-year
  const birthY=BD.getFullYear();
  const curAgeY=Math.round(daysLived/365.25);
  const nextMilestone=Math.ceil(curAgeY/5)*5;
  const mileDate=new Date(BD);
  mileDate.setFullYear(birthY+nextMilestone);
  const mileWeeks=Math.max(0,Math.floor((mileDate-now2)/6048e5));
  const mileTotal=nextMilestone*52;
  const mileElapsed=(curAgeY%5)*52+((curAgeY%5)*52===0?0:livedW%52);
  // or simpler: total weeks from milestone start
  const prevMilestone=nextMilestone-5;
  const prevMilestoneDate=new Date(BD);
  prevMilestoneDate.setFullYear(birthY+prevMilestone);
  const totalMileWeeks=(mileDate-prevMilestoneDate)/6048e5;
  const mileElapsedWeeks=Math.max(0,(now2-prevMilestoneDate)/6048e5);
  const milePct=Math.min(100,(mileElapsedWeeks/totalMileWeeks)*100);
  mileFill.style.width=milePct+'%';
  mileNum.textContent=mileWeeks;
  mileLabel.textContent='menuju '+nextMilestone;

  // Cascade past-cell animation
  animPast(pastCells);
}

// ── INIT ──
function showModal(editing){
  editMode=!!editing;
  const s=JSON.parse(localStorage.getItem('lw')||'null');
  if(s){bInput.value=s.birth; aInput.value=s.age}
  else if(!editing){const def=new Date();def.setFullYear(def.getFullYear()-30);bInput.value=def.toISOString().split('T')[0]}
  startBtn.textContent=editMode?'Simpan':'Mulai';
  document.getElementById('modalHint').textContent=editMode
    ?'Data yang sudah tersimpan akan diperbarui.'
    :'Isi data kamu untuk memulai.';
  modal.classList.add('show');
}

// ── MODAL KEYBOARD ──
startBtn.addEventListener('click',()=>{
  const b=bInput.value,a=parseInt(aInput.value);
  if(!b||!a||a<1) return;
  BD=new Date(b+'T00:00:00'); TA=a;
  if(isNaN(BD.getTime())) return;
  localStorage.setItem('lw',JSON.stringify({birth:b,age:a}));
  modal.classList.remove('show'); build();
  const ci=document.getElementById('configInfo');
  if(ci) ci.textContent='Lahir '+b+' · Target '+a+' tahun';
});
settingsBtn.addEventListener('click',()=>{showModal(true)});
settingsBtn.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')e.preventDefault();showModal(true)});

aInput.addEventListener('keydown',e=>{if(e.key==='Enter')startBtn.click()});
bInput.addEventListener('keydown',e=>{if(e.key==='Enter')startBtn.click()});

// Escape closes modal
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&modal.classList.contains('show')){
    modal.classList.remove('show');
  }
});

// Focus trap: Tab cycle within modal
modal.addEventListener('keydown',e=>{
  if(e.key!=='Tab'||!modal.classList.contains('show')) return;
  const focusable=modal.querySelectorAll('input, button, [tabindex]:not([tabindex="-1"])');
  if(focusable.length===0) return;
  const first=focusable[0], last=focusable[focusable.length-1];
  if(e.shiftKey&&document.activeElement===first){
    e.preventDefault(); last.focus();
  }else if(!e.shiftKey&&document.activeElement===last){
    e.preventDefault(); first.focus();
  }
});

// Auto-focus first input when modal opens
const origShow=showModal;
showModal=function(editing){
  origShow(editing);
  setTimeout(()=>{bInput.focus()},100);
};

function init(){
  const saved=localStorage.getItem('lw');
  if(saved){
    try{
      const d=JSON.parse(saved); BD=new Date(d.birth); TA=d.age;
      if(!isNaN(BD.getTime())&&TA>0){
        const ci=document.getElementById('configInfo');
        if(ci) ci.textContent='Lahir '+d.birth+' · Target '+TA+' tahun';
        build();return
      }
    }catch(e){}
  }
  showModal(false);
}

init();
</script>
</body>
</html>
